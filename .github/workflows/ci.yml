name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simex
          POSTGRES_PASSWORD: simex
          POSTGRES_DB: simex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U simex -d simex"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        env:
          SIMEX_TEST_POSTGRES_DSN: postgresql://simex:simex@127.0.0.1:5432/simex
          SIMEX_REQUIRE_POSTGRES_TESTS: "1"
        run: pytest

  # Development happens on Windows laptops: run the tests there too, so Linux-only CI can't
  # hide breakage on the machine the code is written on.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --ignore=tests/test_ledger.py

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Check Prometheus config and alert rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
              --entrypoint promtool prom/prometheus:v2.53.4 "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          # Expand the glob here, on the host; promtool gets the paths inside the container.
          tests=()
          for test in infra/prometheus/tests/*.test.yml; do
            tests+=("/etc/prometheus/tests/$(basename "$test")")
          done
          promtool test rules "${tests[@]}"
