name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simex
          POSTGRES_PASSWORD: simex
          POSTGRES_DB: simex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U simex -d simex"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Keep this guard: attribution footers change repository history and contributor credit.
      - name: Reject AI attribution
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          pattern='co-authored-by:[[:space:]]*(claude|copilot|openai|chatgpt|anthropic|cursor|gemini|ai([[:space:]]|$))|generated[[:space:]]+with|generated[[:space:]]+by.*claude[[:space:]]+code|claude\.ai/code'

          failed=0
          while IFS= read -r commit; do
            message="$(git show -s --format=%B "$commit")"
            if printf '%s\n' "$message" | grep -Eiq "$pattern"; then
              echo "::error::Commit $commit contains prohibited AI attribution."
              echo "Amend it with 'git commit --amend' or remove it with an interactive 'git rebase', then force-push the branch."
              failed=1
            fi
          done < <(git log --format='%H' "$BASE_SHA..$HEAD_SHA")

          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')"
          if printf '%s\n' "$body" | grep -Eiq "$pattern"; then
            echo "::error::Pull request #$PR_NUMBER contains prohibited AI attribution in its body."
            echo "Edit the PR description to remove it, then rerun CI."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        env:
          SIMEX_TEST_POSTGRES_DSN: postgresql://simex:simex@127.0.0.1:5432/simex
          SIMEX_REQUIRE_POSTGRES_TESTS: "1"
        run: pytest

  # Development happens on Windows laptops: run the tests there too, so Linux-only CI can't
  # hide breakage on the machine the code is written on.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --ignore=tests/test_ledger.py

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Check Prometheus config and alert rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
              --entrypoint promtool prom/prometheus:v2.53.4 "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          # Expand the glob here, on the host; promtool gets the paths inside the container.
          tests=()
          for test in infra/prometheus/tests/*.test.yml; do
            tests+=("/etc/prometheus/tests/$(basename "$test")")
          done
          promtool test rules "${tests[@]}"
