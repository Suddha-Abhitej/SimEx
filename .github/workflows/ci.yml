name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Check Prometheus config and alert rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
              --entrypoint promtool prom/prometheus:v2.53.4 "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          promtool test rules /etc/prometheus/tests/book-audit.test.yml
