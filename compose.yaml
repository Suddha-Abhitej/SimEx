# Local development infrastructure. Application services are added here as they are built.
# Start with: cp .env.example .env && docker compose up -d --wait
#
# Memory budget (production: Oracle Cloud Always Free, ARM64, 2 cores, 12 GB RAM):
#   kafka 1.25 GB, postgres 1 GB, valkey 256 MB, prometheus 512 MB  -> ~3 GB by default
#   grafana 256 MB, only with the "monitoring" profile (docker compose --profile monitoring up -d)
# Every image below publishes linux/amd64 and linux/arm64 variants.
# Ports bind to 127.0.0.1 so a public server never exposes them; use an SSH tunnel to reach them.

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The CLI tool starts its own JVM; give it a small heap so it fits beside the broker.
      test:
        - CMD-SHELL
        - >-
          KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1280M
    restart: unless-stopped

  postgres:
    image: postgres:16.10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simex}
      POSTGRES_DB: ${POSTGRES_DB:-simex}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    shm_size: 128m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1-alpine
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    # maxmemory sits below the container limit to leave room for overhead; derived features and
    # caches can be rebuilt, so evicting the least recently used key is acceptable.
    command: ["valkey-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.4
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  valkey-data:
  prometheus-data:
  grafana-data:
