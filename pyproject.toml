[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simex"
version = "0.0.1"
description = "A realistic, live practice market where anyone can test whether their AI can really trade."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abhitej S" }]
dependencies = [
    "aiokafka>=0.11",
    "anyio>=4,<5",
    # The exchange's ledger is mandatory whenever the API is enabled (ADR 0017), and
    # simex/ledger/sync.py imports asyncpg at module level, so this is a runtime dependency.
    "asyncpg>=0.29",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "prometheus-client>=0.20",
    # The recorder's zstd Parquet files (ADR 0013); wheels for linux/arm64 and Windows
    "pyarrow>=17",
    "sortedcontainers>=2.4",
    "valkey>=6",
    "uvicorn>=0.30,<1",
    "websockets>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    # Clock-offset check in tools/gemini_probe.py
    "ntplib>=0.4",
    "ruff>=0.6",
]

# DuckDB for ad-hoc queries over the recordings (README example)
analysis = ["duckdb>=1.1"]

[project.urls]
Repository = "https://github.com/Suddha-Abhitej/simex"

[tool.hatch.build.targets.wheel]
packages = ["src/simex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
