[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simex"
version = "0.0.1"
description = "A realistic, live practice market where anyone can test whether their AI can really trade."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abhitej S" }]
dependencies = [
    "aiokafka>=0.11",
    "prometheus-client>=0.20",
    "websockets>=15",
]

[project.optional-dependencies]
dev = [
    # Clients used by scripts/smoke_test.py against the local stack (aiokafka is a main dependency)
    "asyncpg>=0.29",
    "valkey>=6",
    "pytest>=8",
    "hypothesis>=6",
    # Clock-offset check in tools/gemini_probe.py
    "ntplib>=0.4",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Suddha-Abhitej/simex"

[tool.hatch.build.targets.wheel]
packages = ["src/simex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
