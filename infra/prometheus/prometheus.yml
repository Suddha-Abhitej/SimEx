global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # The ingestor runs on the host during development (make ingest).
  - job_name: simex-ingest
    static_configs:
      - targets: ["host.docker.internal:9101"]
  # The order book service, also on the host during development (make book).
  - job_name: simex-book
    static_configs:
      - targets: ["host.docker.internal:9102"]
  # The recorder, on the host during development (make record).
  - job_name: simex-recorder
    static_configs:
      - targets: ["host.docker.internal:9103"]
  # The live exchange runner, on the host during development (make exchange).
  - job_name: simex-exchange
    static_configs:
      - targets: ["host.docker.internal:9104"]
  # SimEx services (gateway) are added here as they are built.
