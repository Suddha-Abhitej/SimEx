# promtool test rules infra/prometheus/tests/exchange.test.yml (CI runs it; synthetic series)
rule_files:
  - ../rules/exchange.yml
evaluation_interval: 1m
tests:
  # The measured baseline: a burst of 13 in one go (the 18:09 host stall) and a few more
  # later. Never an alert.
  - interval: 1m
    input_series:
      - series: 'simex_exchange_late_events_total{product_id="BTC-USD",channel="level2"}'
        values: '0x10 13x10 15x20'
      - series: 'simex_exchange_late_events_total{product_id="ETH-USD",channel="trades"}'
        values: '0x20 2x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ExchangeLateRecords
        exp_alerts: []
      - eval_time: 25m
        alertname: ExchangeLateRecords
        exp_alerts: []

  # Five a minute from 10m: the hold-back is too short for this host. An alert once more than
  # 20 have come in 10 minutes, gone 10 minutes after they stop.
  - interval: 1m
    input_series:
      - series: 'simex_exchange_late_events_total{product_id="BTC-USD",channel="level2"}'
        values: '0x10 5+5x9 50x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: ExchangeLateRecords
        exp_alerts: []
      - eval_time: 16m
        alertname: ExchangeLateRecords
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "30 records reached the engine late in 10 minutes"
              description: "Records arrived after the watermark had passed their received time. Check simex_exchange_delivery_seconds against EXCHANGE_MERGE_HOLDBACK_MS and raise the hold-back; the runner's log names each late record and its type."
      - eval_time: 32m
        alertname: ExchangeLateRecords
        exp_alerts: []

  # The watermark falls behind from 11m (60 s, then a minute a minute): the alert fires at 16m.
  - interval: 1m
    input_series:
      - series: 'simex_exchange_watermark_lag_seconds{product_id="BTC-USD"}'
        values: '0.1x10 60+60x20'
      - series: 'simex_exchange_watermark_lag_seconds{product_id="ETH-USD"}'
        values: '0.1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: ExchangeWatermarkStalled
        exp_alerts: []
      - eval_time: 16m
        alertname: ExchangeWatermarkStalled
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "An engine's watermark is 360 s behind the wall clock"
              description: "The runner isn't releasing records: it is stuck or far behind md.level2 or md.trades. Orders would wait; check the runner's log and Kafka."

  - interval: 1m
    input_series:
      - series: 'simex_exchange_gate_state{product_id="BTC-USD",state="stale_level2"}'
        values: '1x20'
      - series: 'simex_exchange_gate_state{product_id="BTC-USD",state="open"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: ExchangeGateClosedTooLong
        exp_alerts: []
      - eval_time: 6m
        alertname: ExchangeGateClosedTooLong
        exp_alerts:
          - exp_labels: {severity: warning, product_id: BTC-USD}
            exp_annotations:
              summary: "The BTC-USD market gate has been closed for 5 minutes"
              description: "Orders are rejected and prints are ignored while the stale-data guard is closed. Inspect simex_exchange_gate_closed_seconds_total by reason and the level2 feed."

  # Caught up, with the hold-back's usual lag: never an alert.
  - interval: 1m
    input_series:
      - series: 'simex_exchange_watermark_lag_seconds{product_id="BTC-USD"}'
        values: '0.12x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ExchangeWatermarkStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'simex_exchange_order_delay_seconds{product_id="BTC-USD"}'
        values: '0.2x10'
      - series: 'simex_exchange_feed_lag_p99_seconds{product_id="BTC-USD"}'
        values: '0.1x10 0.3x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: ExchangeOrderDelayBelowFeedLagP99
        exp_alerts: []
      - eval_time: 12m
        alertname: ExchangeOrderDelayBelowFeedLagP99
        exp_alerts:
          - exp_labels: {severity: warning, product_id: BTC-USD}
            exp_annotations:
              summary: "The BTC-USD order delay is below its feed-lag p99"
              description: "A faster feed may regain an execution edge because the configured anti-cheat delay is below this pair's rolling p99 level2 lag. Re-measure the feed and raise EXCHANGE_ORDER_DELAY_MS if needed."

  - interval: 1m
    input_series:
      - series: 'simex_exchange_order_delay_seconds{product_id="ETH-USD"}'
        values: '0.2x20'
      - series: 'simex_exchange_feed_lag_p99_seconds{product_id="ETH-USD"}'
        values: '0.2x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExchangeOrderDelayBelowFeedLagP99
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'simex_ledger_latency_seconds_bucket{phase="commit",le="0.05"}'
        values: '0x10 0x10'
      - series: 'simex_ledger_latency_seconds_bucket{phase="commit",le="0.1"}'
        values: '0x10 100 200 300 400 500 600 700 800 900'
      - series: 'simex_ledger_latency_seconds_bucket{phase="commit",le="0.25"}'
        values: '0x10 100 200 300 400 500 600 700 800 900'
      - series: 'simex_ledger_latency_seconds_bucket{phase="commit",le="0.5"}'
        values: '0x10 100 200 300 400 500 600 700 800 900'
      - series: 'simex_ledger_latency_seconds_bucket{phase="commit",le="1"}'
        values: '0x10 100 200 300 400 500 600 700 800 900'
      - series: 'simex_ledger_latency_seconds_bucket{phase="commit",le="+Inf"}'
        values: '0x10 100 200 300 400 500 600 700 800 900'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExchangeLedgerCommitP99TooHigh
        exp_alerts: []
      - eval_time: 22m
        alertname: ExchangeLedgerCommitP99TooHigh
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Ledger commit p99 is above the 50 ms budget"
              description: "The ledger commit path is exceeding the approved 50 ms p99 budget. Check simex_ledger_latency_seconds, Postgres CPU and the host before accepting more order flow on the two-core deployment."
