# The live exchange runner's merge (ADR 0015). A late record's delivery took longer than the
# hold-back, so the ordering margin was lost for it. A few, in bursts, are the measured baseline
# (36 in 3 h 45 m at a 100 ms hold-back, 13 of them in one second); the alert fires on a rate,
# when the hold-back is plainly too short for the host.
# A stalled watermark means the engines aren't advancing: the runner is stuck or far behind
# Kafka. A dead feed is not this alert: caught-up partitions keep the watermark moving, and
# the stale-data guard (#9) handles a feed that stops.
groups:
  - name: simex-exchange
    rules:
      - alert: ExchangeLateRecords
        expr: sum(increase(simex_exchange_late_events_total[10m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} records reached the engine late in 10 minutes"
          description: >-
            Records arrived after the watermark had passed their received time. Check
            simex_exchange_delivery_seconds against EXCHANGE_MERGE_HOLDBACK_MS and raise the
            hold-back; the runner's log names each late record and its type.
      - alert: ExchangeWatermarkStalled
        expr: max(simex_exchange_watermark_lag_seconds) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An engine's watermark is {{ $value | printf \"%.0f\" }} s behind the wall clock"
          description: >-
            The runner isn't releasing records: it is stuck or far behind md.level2 or
            md.trades. Orders would wait; check the runner's log and Kafka.
      - alert: ExchangeGateClosedTooLong
        expr: sum by (product_id) (simex_exchange_gate_state{state!="open"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.product_id }} market gate has been closed for 5 minutes"
          description: >-
            Orders are rejected and prints are ignored while the stale-data guard is closed.
            Inspect simex_exchange_gate_closed_seconds_total by reason and the level2 feed.
      - alert: ExchangeOrderDelayBelowFeedLagP99
        expr: simex_exchange_order_delay_seconds < simex_exchange_feed_lag_p99_seconds
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.product_id }} order delay is below its feed-lag p99"
          description: >-
            A faster feed may regain an execution edge because the configured anti-cheat delay
            is below this pair's rolling p99 level2 lag. Re-measure the feed and raise
            EXCHANGE_ORDER_DELAY_MS if needed.
